version: '3.8'

# =============================================================
#  DXC Portal — Docker Compose Production
#  Structure repo attendue :
#    MoemenBoughanmi/
#      database/init.sql
#      backend/auth-microservice/
#      backend/profiles-microservice/
#      backend/sla-microservice/
#      frontend/
# =============================================================

services:

  # ===========================================================
  #  BASE DE DONNÉES MYSQL
  # ===========================================================
  mysql:
    image: mysql:8.0
    container_name: dxc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      # dxc_form est la base principale (auth + sla + profiles)
      MYSQL_DATABASE: dxc_form
    ports:
      - "3306:3306"
    volumes:
      # Persistance des données entre redémarrages
      - mysql-data:/var/lib/mysql
      # init.sql est exécuté automatiquement au PREMIER démarrage
      # (uniquement si le volume mysql-data est vide)
      - ../MoemenBoughanmi/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dxc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot@123"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ===========================================================
  #  AUTH MICROSERVICE  (port interne 8083)
  # ===========================================================
  auth-microservice:
    build:
      context: ../MoemenBoughanmi/backend/auth-microservice
      dockerfile: Dockerfile
    image: ghof55/auth-microservice:latest
    container_name: dxc-auth
    restart: always
    ports:
      - "8083:8083"
    environment:
      # Remplace localhost par le nom du service Docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxc_form?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      # URL frontend utilisée dans les emails de vérification
      APP_FRONTEND_URL: http://localhost
      # JWT secret (même valeur que dans application.properties)
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dxc-network

  # ===========================================================
  #  PROFILES MICROSERVICE  (port interne 8085)
  # ===========================================================
  profiles-microservice:
    build:
      context: ../MoemenBoughanmi/backend/profiles-microservice
      dockerfile: Dockerfile
    image: ghof55/profiles-microservice:latest
    container_name: dxc-profiles
    restart: always
    ports:
      - "8085:8085"
    environment:
      # application.properties pointe sur dxc_form → on respecte ça
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxc_form?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
    depends_on:
      mysql:
        condition: service_healthy
      auth-microservice:
        condition: service_started
    networks:
      - dxc-network

  # ===========================================================
  #  SLA MICROSERVICE  (port interne 8086)
  # ===========================================================
  sla-microservice:
    build:
      context: ../MoemenBoughanmi/backend/sla-microservice
      dockerfile: Dockerfile
    image: ghof55/sla-microservice:latest
    container_name: dxc-sla
    restart: always
    ports:
      # CORRECTION : était 8086:8080, l'app écoute sur 8086
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxc_form?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
      APP_HR_EMAIL: rh@dxc.com
    depends_on:
      mysql:
        condition: service_healthy
      auth-microservice:
        condition: service_started
    networks:
      - dxc-network

  # ===========================================================
  #  FRONTEND NGINX
  #  Le frontend JS appelle localhost:8083, :8085, :8086
  #  En prod Docker, "localhost" depuis le navigateur pointe
  #  sur la machine hôte (pas le conteneur) → ça fonctionne
  #  car les ports backend sont exposés sur l'hôte ci-dessus.
  #
  #  Le proxy_pass nginx est configuré en plus pour les
  #  environnements où l'hôte n'est pas accessible directement
  #  (CI, cloud, etc.) via les locations /api/auth, /api/sla...
  # ===========================================================
  frontend:
    build:
      context: ../MoemenBoughanmi/frontend
      dockerfile: Dockerfile
    image: ghof55/dxc-frontend:latest
    container_name: dxc-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Mount html files for live reload during development
      - ../MoemenBoughanmi/frontend/html:/usr/share/nginx/html/html:ro
    depends_on:
      - auth-microservice
      - profiles-microservice
      - sla-microservice
    networks:
      - dxc-network

# =============================================================
#  RÉSEAU
# =============================================================
networks:
  dxc-network:
    driver: bridge

# =============================================================
#  VOLUMES
# =============================================================
volumes:
  # Données MySQL persistées entre docker-compose down/up
  mysql-data:
    driver: local
