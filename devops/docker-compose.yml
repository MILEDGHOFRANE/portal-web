version: '3.8'

services:

  # ===========================================================
  #  BASE DE DONNÉES MYSQL
  # ===========================================================
  mysql:
    image: mysql:8.0
    container_name: dxc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: dxc_form
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../MoemenBoughanmi/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dxc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot@123"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ===========================================================
  #  AUTH MICROSERVICE  (port 8083)
  # ===========================================================
  auth-microservice:
    build:
      context: ../MoemenBoughanmi/backend/auth-microservice
      dockerfile: Dockerfile
    image: ghof55/auth-microservice:latest
    container_name: dxc-auth
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxc_form?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      APP_FRONTEND_URL: http://localhost:3000
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: moememboughanmi@gmail.com
      SPRING_MAIL_PASSWORD: rlhhepvctqoqqqhz
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dxc-network

  # ===========================================================
  #  PROFILES MICROSERVICE  (port 8085)
  # ===========================================================
  profiles-microservice:
    build:
      context: ../MoemenBoughanmi/backend/profiles-microservice
      dockerfile: Dockerfile
    image: ghof55/profiles-microservice:latest
    container_name: dxc-profiles
    restart: always
    ports:
      - "8085:8085"
    environment:
      # profiles_db : base dédiée créée par init.sql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/profiles_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
    depends_on:
      mysql:
        condition: service_healthy
      auth-microservice:
        condition: service_started
    networks:
      - dxc-network

  # ===========================================================
  #  SLA MICROSERVICE  (port 8086)
  # ===========================================================
  sla-microservice:
    build:
      context: ../MoemenBoughanmi/backend/sla-microservice
      dockerfile: Dockerfile
    image: ghof55/sla-microservice:latest
    container_name: dxc-sla
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dxc_form?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
      APP_JWT_SECRET: ZHhjLXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbi13aXRoLWEtdmVyeS1sb25nLXJhbmRvbS1zdHJpbmc=
      APP_HR_EMAIL: rh@dxc.com
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: moememboughanmi@gmail.com
      SPRING_MAIL_PASSWORD: rlhhepvctqoqqqhz
    depends_on:
      mysql:
        condition: service_healthy
      auth-microservice:
        condition: service_started
    networks:
      - dxc-network

  # ===========================================================
  #  FRONTEND NGINX  (port 3000)
  # ===========================================================
  frontend:
    build:
      context: ../MoemenBoughanmi/frontend
      dockerfile: Dockerfile
    image: ghof55/dxc-frontend:latest
    container_name: dxc-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - auth-microservice
      - profiles-microservice
      - sla-microservice
    networks:
      - dxc-network

networks:
  dxc-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
