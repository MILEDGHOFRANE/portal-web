server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Handle the root / by redirecting to login.html
    location = / {
        return 301 /login.html;
    }

    # Handle direct access to html files without the prefix
    location ~ ^/(.*\.html)$ {
        try_files /html/$1 =404;
    }

    # Handle assets (css, js)
    location /css/ {
        try_files $uri =404;
    }
    location /js/ {
        try_files $uri =404;
    }

    # Fallback to login if something is wrong
    location / {
        try_files $uri $uri/ /html/login.html;
    }
}
